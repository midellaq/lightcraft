name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * *'  # Ogni giorno alle 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream \
            https://github.com/storytold/lightcraft.git

          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
